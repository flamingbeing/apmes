# Deploys logbook/firestore.rules (it covers all five apps) to the Firebase project apmes-logbook. It signs in with
# GitHub's OIDC token (Workload Identity Federation: only this repo may use the provider) as a service account that can
# only change rules, so no key is stored anywhere. Runs when a merge to main changes the rules, or by hand (Run workflow).
# The workflow compiles the rules first, so a syntax error leaves the live rules as they were.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths: ['logbook/firestore.rules']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/474134277199/locations/global/workloadIdentityPools/github/providers/apmes-repo
          service_account: firebase-rules-deployer@apmes-logbook.iam.gserviceaccount.com
      - name: Deploy logbook/firestore.rules to apmes-logbook
        working-directory: logbook
        run: |
          echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          npx --yes firebase-tools@13 deploy --only firestore:rules --project apmes-logbook --non-interactive
