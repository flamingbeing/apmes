# The merge checklist from AGENTS.md, on every PR and every push to main: the repo check (with the Worker tests and
# the generated evals files), every unit test, the proof-read, the Firestore rules in the emulator, and the browser
# suites of evals, People, CCC and the home page (one job each, side by side). The long logbook suite
# (tools/test-logbook.sh) stays with the session that changes the logbook.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in evals/test/*.test.mjs logbook/test/*.test.mjs people/test/*.test.mjs ccc/test/*.test.mjs home/test/*.test.mjs; do echo "== $f"; node --import ./logbook/test/app-sync-hook.mjs "$f" || exit 1; done
      - uses: flamingbeing/app-devkit/setup-tools@v1.15.0
      - name: Proof-read (pages and documents)
        run: node .devkit/tools/proofread.mjs
      # What each page loads before it can draw, gzipped (30 Oct 2026: logbook 282 KiB / 62 requests, people 110,
      # ccc 90, evals 63, home 6). Over budget: load the new screen or extra on first use (import()), don't raise it.
      - name: Startup budget
        run: |
          node .devkit/tools/startup-size.mjs logbook/index.html --max 300 --max-files 70
          node .devkit/tools/startup-size.mjs people/index.html --max 125 --max-files 25
          node .devkit/tools/startup-size.mjs ccc/index.html --max 100 --max-files 25
          node .devkit/tools/startup-size.mjs evals/index.html --max 75 --max-files 18
          node .devkit/tools/startup-size.mjs home/index.html --max 15 --max-files 10

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - name: Cache rules test tools and emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anawj-rules
            ~/.cache/firebase/emulators
          key: rules-${{ runner.os }}-${{ hashFiles('tools/test-rules.sh') }}
      - name: Firestore rules (local emulator, demo project)
        run: bash tools/test-rules.sh

  browser:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no browser deps for ubuntu-latest (26.04)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Evals, cmd: "node evals/test/e2e.spec.mjs && node evals/test/edge.e2e.mjs && node evals/test/a11y.mjs" }
          - { name: People, cmd: "node people/test/e2e.mjs" }
          - { name: CCC, cmd: "node ccc/test/e2e.mjs" }
          - { name: Home, cmd: "node home/test/e2e.mjs" }
          - { name: Update core, cmd: "PORT=8110 node logbook/test/e2e/update-core.mjs" }
          - { name: Logbook swipe feel, cmd: "PORT=8110 node logbook/test/e2e/swipe-feel.mjs" }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # People's test also drives NUH Junior Monthly, which lives in the rosters repo
      - uses: actions/checkout@v4
        if: matrix.name == 'People'
        with:
          repository: flamingbeing/rosters
          path: .rosters
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - name: Install Playwright
        run: npm install -g playwright@1.56.1
      - uses: flamingbeing/app-devkit/setup-browser@v1.1.0
        with:
          playwright-version: '1.56.1'
          devkit-dir: ''
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs" PW_PATH="$(npm root -g)/playwright" ROSTERS_DIR="$PWD/.rosters"
          (python3 -m http.server 8110 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}
