# The merge checklist from AGENTS.md, on every PR and every push to main: the repo check (with the Worker tests and
# the generated evals files), every unit test, the proof-read, the Firestore rules in the emulator, and the browser
# suites of evals, People, applicants and CCC 360 (one job each, side by side). The long logbook suite
# (tools/test-logbook.sh) stays with the session that changes the logbook.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in evals/test/*.test.mjs logbook/test/*.test.mjs people/test/*.test.mjs applicants/test/*.test.mjs 360/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Firestore rules (local emulator, demo project)
        run: bash tools/test-rules.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Evals, cmd: "node evals/test/e2e.spec.mjs && node evals/test/edge.e2e.mjs && node evals/test/a11y.mjs" }
          - { name: People, cmd: "node people/test/e2e.mjs" }
          - { name: Applicants, cmd: "node applicants/test/e2e.mjs" }
          - { name: CCC 360, cmd: "node 360/test/e2e.mjs" }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # People's test also drives NUH Junior Monthly, which lives in the rosters repo
      - uses: actions/checkout@v4
        if: matrix.name == 'People'
        with:
          repository: flamingbeing/rosters
          path: .rosters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs" PW_PATH="$(npm root -g)/playwright" ROSTERS_DIR="$PWD/.rosters"
          (python3 -m http.server 8110 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}
