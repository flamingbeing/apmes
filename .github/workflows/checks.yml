# The merge checklist from AGENTS.md, on every PR and every push to main: the repo check (with the Worker tests and
# the generated evals files), every unit test, the proof-read, the Firestore rules in the emulator, and the browser
# suites of evals, People, CCC and the home page (one job each, side by side). The long logbook suite
# (tools/test-logbook.sh) stays with the session that changes the logbook.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in evals/test/*.test.mjs logbook/test/*.test.mjs people/test/*.test.mjs ccc/test/*.test.mjs home/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache rules test tools and emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anawj-rules
            ~/.cache/firebase/emulators
          key: rules-${{ runner.os }}-${{ hashFiles('tools/test-rules.sh') }}
      - name: Firestore rules (local emulator, demo project)
        run: bash tools/test-rules.sh

  browser:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no browser deps for ubuntu-latest (26.04)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Evals, cmd: "node evals/test/e2e.spec.mjs && node evals/test/edge.e2e.mjs && node evals/test/a11y.mjs" }
          - { name: People, cmd: "node people/test/e2e.mjs" }
          - { name: CCC, cmd: "node ccc/test/e2e.mjs" }
          - { name: Home, cmd: "node home/test/e2e.mjs" }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # People's test also drives NUH Junior Monthly, which lives in the rosters repo
      - uses: actions/checkout@v4
        if: matrix.name == 'People'
        with:
          repository: flamingbeing/rosters
          path: .rosters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.56.1-${{ runner.os }}-ubuntu24
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs" PW_PATH="$(npm root -g)/playwright" ROSTERS_DIR="$PWD/.rosters"
          (python3 -m http.server 8110 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}
