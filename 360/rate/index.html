<script>
  // Raters reach this page from a link in an email (no sign-in). Light or dark follows the phone unless evals' theme
  // choice says otherwise on this device.
  try { var t = localStorage.getItem('evals-theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#161618'; } catch (e) {}
</script>

  .rt-saved { margin: 4px 0 0; font-size: var(--a-text-sm); color: var(--a-ink-2); }
